name: NuGet update watch

# Opens (or updates) one issue when a Google.* package referenced in the csproj has a newer
# stable release on NuGet. The DLLs live in Source/NET/Bin without PackageReference, so
# Dependabot can't track them. All Google.* references are checked, since the transitive
# packages release independently of Google.Cloud.Storage.V1.
#
# Not checked: Newtonsoft.Json (its version follows the OutSystems platform) and System.* /
# Microsoft.* (already well above the SDK's minimums). Both are updated by hand.

on:
  schedule:
    - cron: '0 9 1 * *'   # monthly, 1st at 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare every bundled Google.* package with the latest on NuGet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CSPROJ=Source/NET/GoogleCloudStorage_ext.csproj
          OUTDATED=""

          # "Name|Version" for every Google.* assembly reference in the csproj
          while IFS='|' read -r NAME CURRENT; do
            [ -z "$NAME" ] && continue
            PKG=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')
            LATEST=$(curl -sf "https://api.nuget.org/v3-flatcontainer/$PKG/index.json" \
              | jq -r '[.versions[] | select(test("-") | not)] | last') || {
                echo "::warning::could not query NuGet for $NAME"; continue; }

            # csproj carries 4-part assembly versions (1.76.0.0); NuGet often
            # publishes 3-part (1.76.0). Treat "X.Y.Z" and "X.Y.Z.0" as equal.
            if [ "$LATEST" = "$CURRENT" ] || [ "$LATEST.0" = "$CURRENT" ]; then
              echo "OK        $NAME $CURRENT"
              continue
            fi
            if [ "$(printf '%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)" = "$CURRENT" ]; then
              echo "OK        $NAME $CURRENT (newer than published $LATEST)"
              continue
            fi
            echo "OUTDATED  $NAME $CURRENT -> $LATEST"
            OUTDATED="${OUTDATED}- \`$NAME\`: **$CURRENT** -> **$LATEST**"$'\n'
          done < <(grep -oP '<Reference Include="\KGoogle[^,]*, Version=[0-9.]+' "$CSPROJ" \
                   | sed 's/, Version=/|/')

          if [ -z "$OUTDATED" ]; then
            echo "All bundled Google packages are up to date."
            exit 0
          fi

          # One open issue at a time; refresh its body if the set changed.
          TITLE="Update bundled Google Cloud Storage SDK packages"
          BODY="Newer stable releases are available for packages bundled in \`Source/NET/Bin\`:

          $OUTDATED
          Update steps (see CONTRIBUTING.md):
          1. Download each package's \`net462\` asset and replace the DLL/XML pair in \`Source/NET/Bin/\`.
          2. Update the matching \`<Reference ... Version=...>\` in \`GoogleCloudStorage_ext.csproj\`.
          3. Build and run \`tests/run-tests.ps1\` - all checks must pass.
          4. Republish via Integration Studio.

          Release notes: https://github.com/googleapis/google-cloud-dotnet/releases"

          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
